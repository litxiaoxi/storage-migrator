version=1.0.0

# Halo 插件开发要求 Java 21+，本机默认 JAVA_HOME 为 JDK 17，这里显式指定 JDK 21。
# 注意：这是本机路径，提交到公开仓库前请删除该行或改用本机 ~/.gradle/gradle.properties 配置。
org.gradle.java.home=D:/Develop/jdk/jdk-21

# 中文 Windows 下 Gradle 默认用 GBK，Lombok 插件生成的配置按 UTF-8 读取会导致构建失败，
# 统一固定为 UTF-8（项目路径含中文时尤其必要）。
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
